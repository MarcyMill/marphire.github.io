<!DOCTYPE html>
<html>
<head>
	<title>Create account</title>
	<meta charset="utf-8">
	<style>
		body {
			font-family: system-ui, sans-serif;
			background: #1e90ff;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
		}
		.box {
			background: white;
			padding: 32px;
			border-radius: 16px;
			width: 340px;
			box-shadow: 0 20px 40px rgba(0,0,0,0.2);
		}
		input {
			width: 100%;
			padding: 14px;
			margin-bottom: 14px;
			border-radius: 10px;
			border: 1px solid #ddd;
			font-size: 16px;
		}
		.small-btn {
			width: 100%;
			padding: 10px;
			margin-bottom: 14px;
			border-radius: 10px;
			border: 1px solid #ccc;
			background: #f3f3f3;
			cursor: pointer;
			font-size: 14px;
		}
		button {
			width: 100%;
			padding: 14px;
			border: none;
			border-radius: 12px;
			font-size: 16px;
			font-weight: 600;
			background: orange;
			color: white;
			cursor: pointer;
		}
		.error {
			color: red;
			margin-top: 10px;
			font-size: 14px;
		}
	</style>
</head>

<body>
	<div class="box">
		<input id="username" placeholder="Username">
		<input id="email" placeholder="Email address">
		<input id="password" type="password" placeholder="Password">
		<input id="password2" type="password" placeholder="Enter password again">

		<button class="small-btn" onclick="togglePassword()">Show password</button>
		<button onclick="submitForm()">Create new account</button>

		<div id="error" class="error"></div>
	</div>

	<script>
	let visible = false;

	function togglePassword() {
		const p1 = document.getElementById("password");
		const p2 = document.getElementById("password2");
		const btn = document.querySelector(".small-btn");

		visible = !visible;
		const type = visible ? "text" : "password";

		p1.type = type;
		p2.type = type;

		btn.textContent = visible ? "Hide password" : "Show password";
	}

	async function submitForm() {
		alert("SubmitForm triggered");
		const username = document.getElementById("username").value.trim();
		const email = document.getElementById("email").value.trim();
		const password = document.getElementById("password").value;
		const password2 = document.getElementById("password2").value;
		const errorBox = document.getElementById("error");

		errorBox.textContent = "";

		if (!username || !email || !password) {
			errorBox.textContent = "All fields are required.";
			return;
		}

		if (password !== password2) {
			errorBox.textContent = "Passwords do not match.";
			return;
		}

		const url =
			"http://127.0.0.1:8000/api/register" +
			"?username=" + encodeURIComponent(username) +
			"&email=" + encodeURIComponent(email) +
			"&password=" + encodeURIComponent(password);
		console.log("sending request");

		const response = await fetch(url, {
			method: "POST"
		});

		const data = await response.json();

		if (!data.success) {
			errorBox.textContent = data.message;
		} else {
			alert("REGISTER SUCCESS");
			window.location.href = "/welcome.html";
		}
	}
	</script>
</body>
</html>
