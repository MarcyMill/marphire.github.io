<!DOCTYPE html>
<html>
<head>
	<title>Create account</title>
	<meta charset="utf-8">
	<style>
		body {
			font-family: system-ui, sans-serif;
			background: #1e90ff;
			display: flex;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
		}
		.box {
			background: white;
			padding: 32px;
			border-radius: 16px;
			width: 340px;
			box-shadow: 0 20px 40px rgba(0,0,0,0.2);
		}
		input {
			width: 100%;
			padding: 14px;
			margin-bottom: 14px;
			border-radius: 10px;
			border: 1px solid #ddd;
			font-size: 16px;
		}
		.toggle {
			font-size: 14px;
			margin-bottom: 14px;
			cursor: pointer;
			user-select: none;
		}
		button {
			width: 100%;
			padding: 14px;
			border: none;
			border-radius: 12px;
			font-size: 16px;
			font-weight: 600;
			background: orange;
			color: white;
			cursor: pointer;
		}
		.error {
			color: red;
			margin-top: 10px;
			font-size: 14px;
		}
	</style>
</head>

<body>
	<div class="box">
		<input id="username" placeholder="Username">
		<input id="email" placeholder="Email address">

		<input id="password" type="password" placeholder="Password">
		<input id="password2" type="password" placeholder="Enter password again">

		<div class="toggle">
			<input type="checkbox" id="showPw" onclick="togglePassword()">
			<label for="showPw">Show password</label>
		</div>

		<button onclick="submitForm()">Create new account</button>
		<div id="error" class="error"></div>
	</div>

	<script>
	function togglePassword() {
		const p1 = document.getElementById("password");
		const p2 = document.getElementById("password2");
		const type = p1.type === "password" ? "text" : "password";
		p1.type = type;
		p2.type = type;
	}

	async function submitForm() {
		const username = document.getElementById("username").value;
		const password = document.getElementById("password").value;
		const password2 = document.getElementById("password2").value;
		const errorBox = document.getElementById("error");

		errorBox.textContent = "";

		if (password !== password2) {
			errorBox.textContent = "Passwords do not match.";
			return;
		}

		const response = await fetch(
			"http://localhost:8080/api/check-username?username=" + encodeURIComponent(username)
		);

		const exists = await response.json();

		if (exists) {
			errorBox.textContent = "Username already exists. Choose another.";
		} else {
			window.location.href = "check.html";
		}
	}
	</script>
</body>
</html>
