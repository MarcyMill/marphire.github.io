<!DOCTYPE html>
<html>
<head>
	<title>Login | Marphire</title>
	<meta name="description" content="Login to Marphire">

	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
			background-color: DodgerBlue;
		}

		/* Center container */
		.login-wrapper {
			width: 100%;
			height: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		/* Card */
		.login-card {
			background: white;
			padding: 48px;
			width: 360px;
			border-radius: 18px;
			box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
		}

		.login-card h1 {
			margin: 0 0 28px 0;
			font-size: 26px;
			font-weight: 700;
			color: #111;
			text-align: center;
		}

		/* Inputs */
		.input-field {
			width: 100%;
			padding: 16px 14px;
			margin-bottom: 18px;
			font-size: 16px;
			border-radius: 10px;
			border: 1.5px solid #ddd;
			outline: none;
			transition: border-color 0.2s, box-shadow 0.2s;
		}

		.input-field:focus {
			border-color: #ff8c00;
			box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.2);
		}

		/* Button */
		.login-btn {
			width: 100%;
			padding: 16px;
			font-size: 18px;
			font-weight: 600;
			color: white;
			background: linear-gradient(135deg, #ff8c00, #ffa733);
			border: none;
			border-radius: 12px;
			cursor: pointer;
			box-shadow: 0 12px 30px rgba(255, 140, 0, 0.4);
			transition: transform 0.2s, box-shadow 0.2s;
		}

		.login-btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 18px 40px rgba(255, 140, 0, 0.55);
		}

		.login-btn:active {
			transform: scale(0.97);
		}
	</style>
</head>

<body>
	<div class="login-wrapper">
		<div class="login-card">
			<h1>Welcome back</h1>

			<input
				type="text"
				class="input-field"
				placeholder="Username"
			>

			<input
				type="password"
				class="input-field"
				placeholder="Password"
			>

			<button class="login-btn">Login</button>
		</div>
	</div>
</body>
</html>
