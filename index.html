<!DOCTYPE html>
<html>
<head>
	<title>Marphire | Projects platform - everyone can be shiny.</title>
	<meta name="description" content="Marphire, everyone can be shiny.">

	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
		}

		body {
			background-image: url("Login.png");
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
		}

		/* Container to position button */
		.action-container {
			position: absolute;
			top: 20%;
			right: 8%;
		}

		/* Modern button */
		.action-btn {
			padding: 20px 44px;
			font-size: 22px;
			font-weight: 600;
			color: white;
			background: linear-gradient(135deg, #1e90ff, #4facfe);
			border: none;
			border-radius: 14px;
			cursor: pointer;
			box-shadow: 0 12px 30px rgba(30, 144, 255, 0.35);
			transition: all 0.25s ease;
		}

		.action-btn:hover {
			transform: translateY(-3px) scale(1.03);
			box-shadow: 0 18px 40px rgba(30, 144, 255, 0.5);
		}

		.action-btn:active {
			transform: scale(0.98);
		}
	</style>
</head>

<body>
	<div class="action-container">
		<button class="action-btn">Login / Register</button>
	</div>
</body>
</html>

</html>
