<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Search</title>

	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100%;
			height: 100%;
			font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
		}

		body {
			display: flex;
			justify-content: center;
			align-items: center;
			background: #87ceeb; /* pure sky blue */
		}

		.search-container {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 18px;
		}

		.label {
			font-size: 28px;
			font-weight: 800;
			color: #ff8c00; /* bright orange */
		}

		.search-box {
			width: 420px;
			padding: 16px 22px;
			font-size: 18px;
			border: none;
			border-radius: 999px;
			outline: none;
			background: white;
			box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
		}

		.search-box::placeholder {
			color: #aaa;
		}
	</style>
</head>

<body>
	<div class="search-container">
		<div class="label">Enter your system name here</div>
		<input type="text" class="search-box" placeholder="Search">
	</div>
</body>
</html>
