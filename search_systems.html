<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>Systems Search</title>
</head>

<body>

	<input id="query" placeholder="Enter system name">
	<button onclick="search()">Search</button>

	<div id="result"></div>

	<script>
		async function search() {
			// 1. get input
			const query = document.getElementById("query").value

			// 2. call backend
			const response = await fetch(
				"https://YOUR-BACKEND-URL/search?query=" + encodeURIComponent(query)
			)

			// 3. read result
			const data = await response.json()

			// 4. show result
			document.getElementById("result").innerText =
				JSON.stringify(data, null, 2)
		}
	</script>

</body>
</html>
